components:
  schemas:
    ImageDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        password:
          type: string
          writeOnly: true
        image:
          $ref: "#/components/schemas/ImageDTO"
        roles:
          type: array
          items:
            type: string
    TravelDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ownerName:
          type: string
        title:
          type: string
        coverImage:
          $ref: "#/components/schemas/ImageDTO"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        description:
          type: string
        countries:
          type: array
          items:
            type: string
        cities:
          type: array
          items:
            type: string
        places:
          type: array
          items:
            type: string
        rating:
          type: integer
          format: int32
        comment:
          type: string
        carouselImageUrls:
          type: array
          items:
            $ref: "#/components/schemas/ImageDTO"
        itineraryUrl:
          type: string
        itineraryPath:
          type: string
        itineraryId:
          type: string
        emailsColaborators:
          type: array
          items:
            type: string
    ReviewDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        reviewText:
          type: string
        rating:
          type: integer
          format: int32
        authorName:
          type: string
        imageId:
          type: integer
          format: int64
        imageUrl:
          type: string
    DestinationDTO:
