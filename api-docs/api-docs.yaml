openapi: 3.1.0
info:
  title: NextJourney REST API
  description: "API REST de NextJourney para gestionar usuarios, destinos, viajes,\
    \ imágenes y reseñas."
  version: v1
servers:
- url: https://localhost:8443
  description: Generated server url
tags:
- name: Destinos
  description: Consulta y administración de destinos y lugares asociados.
- name: Viajes
  description: "Gestión de viajes, itinerarios e imágenes asociadas."
- name: Reseñas
  description: "Listado, creación y gestión de reseñas sobre lugares."
- name: Imágenes
  description: Consulta y administración de imágenes almacenadas en la aplicación.
- name: Usuarios
  description: Perfil de usuario y operaciones sobre cuenta e imágenes de perfil.
- name: Autenticación
  description: "Inicio y cierre de sesión, registro y renovación de tokens JWT."
